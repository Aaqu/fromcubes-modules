name: Publish NPM packages

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: release notes are built from the commit
          # range between a package's previous tag and HEAD.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install and test
        run: |
          npm ci
          npm test

      # Each package is released on its own, when its version differs from
      # its latest tag. Add-ons go first: they peer-depend on the core only
      # loosely (>=0.1.0 <1.0.0), so the order rarely matters, but a core
      # release that relies on a new add-on version must find it published.
      - name: Publish changed packages
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          : > released.txt
          for DIR in fromcubes-auth-headers fromcubes-tailwind fromcubes-assets fromcubes-react; do
            PKG="packages/$DIR/package.json"
            NAME=$(jq -r .name "$PKG")
            VERSION=$(jq -r .version "$PKG")
            # Release tags are unscoped (`fromcubes-tailwind@x.y.z`): strip the
            # npm scope so lookup and creation use the same prefix.
            PREFIX=${NAME##*/}
            if git rev-parse -q --verify "refs/tags/$PREFIX@$VERSION" >/dev/null; then
              echo "$PREFIX $VERSION: already released"
              continue
            fi
            PREV_TAG=$(git tag --list "${PREFIX}@*" --sort=-v:refname | head -n1 || true)
            # Idempotent: a run that published but died before tagging (or a
            # manual publish) must not try again — npm refuses a version twice.
            # Only the tag and the GitHub release are still owed.
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$PREFIX $VERSION: already on npm, releasing on GitHub only"
            else
              echo "$PREFIX: ${PREV_TAG:-none} -> $VERSION"
              if [[ "$VERSION" == *-alpha* ]]; then
                # Alpha releases go straight to `latest` ON PURPOSE: the registry
                # copies README into the packument only on a publish that sets
                # the latest tag — `npm dist-tag add … latest` afterwards does
                # NOT refresh it, which left the flows.nodered.org page empty.
                # Deliberately NO `alpha` dist-tag: `npm dist-tag add` is a
                # 2FA-gated write that fails with EOTP in CI (publish itself
                # passes via OIDC provenance), and `latest` is the newest alpha.
                TAG=latest
              elif [[ "$VERSION" == *-beta* ]]; then
                TAG=beta
              elif [[ "$VERSION" == *-rc* ]]; then
                TAG=rc
              else
                TAG=latest
              fi
              # The registry can lag a few minutes behind a publish, so `npm view`
              # may miss a version that is already there; npm then refuses with
              # "cannot publish over the previously published versions". That
              # means done, not failed.
              if ! OUT=$(npm publish --workspace "packages/$DIR" --tag "$TAG" --provenance 2>&1); then
                echo "$OUT"
                if grep -q "previously published" <<<"$OUT"; then
                  echo "$PREFIX $VERSION: already on npm (registry lagging), releasing on GitHub only"
                else
                  exit 1
                fi
              else
                echo "$OUT"
              fi
            fi
            # One line per package: dir, tag to create, previous tag. Kept in a
            # file, never spliced into a script: later steps read it as data.
            printf '%s %s %s\n' "$DIR" "$PREFIX@$VERSION" "$PREV_TAG" >> released.txt
          done
          echo "count=$(wc -l < released.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Collect release notes
        if: steps.publish.outputs.count != '0'
        run: |
          mkdir -p .release-notes
          while read -r DIR TAG PREV; do
            if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
              RANGE="$PREV..HEAD"
            else
              RANGE="HEAD"   # first release of this package — list everything
            fi
            {
              echo '## Changes'
              git log "$RANGE" --no-merges --pretty='- %s (%h)' -- "packages/$DIR"
            } > ".release-notes/$TAG.md"
          done < released.txt

      - name: Create GitHub Releases
        if: steps.publish.outputs.count != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            for (const file of fs.readdirSync(".release-notes")) {
              const tag = file.replace(/\.md$/, "");
              try {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  target_commitish: context.sha,
                  name: tag,
                  body: fs.readFileSync(".release-notes/" + file, "utf8") || `Release ${tag}`,
                });
              } catch (e) {
                core.setFailed(`${tag}: ${e.message}`);
              }
            }
