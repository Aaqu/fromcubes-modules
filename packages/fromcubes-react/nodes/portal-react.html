<!-- ============================================================
     Portal Code Workspace — sidebar tab + full-screen editor overlay.
     Served from nodes/editor/ via the /fromcubes-react/<version>/editor admin route.
     ============================================================ -->
<script type="text/javascript">
  // Loaded from the versioned asset path the runtime exports (ASSET_BASE in
  // lib/admin-api.js), so no cache — browser, CDN or proxy — can serve this
  // template an older file, or a 404 it remembered. Execution order follows
  // insertion order (async = false); every script waits for what it needs.
  (function () {
    const base = (RED.settings && RED.settings.portalReactAssetBase) || "fromcubes-react/";
    window.__fcAssetBase = base;
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = base + "editor/workspace.css";
    document.head.appendChild(link);
    ["file-tree.js", "class-completion.js", "workspace.js", "format.js", "provider-settings.js"].forEach(function (file) {
      const s = document.createElement("script");
      s.src = base + "editor/" + file;
      s.async = false;
      document.head.appendChild(s);
    });
  })();
</script>

<!-- ============================================================
     Shared: Monaco loader (used by both node editors)
     ============================================================ -->
<script type="text/javascript">
  (function () {
    const PREFIX = "[FC-Monaco]";

    // Shared editor options — used by both component and portal-react editors
    window.__fcEditorOpts = {
      theme: "vs-dark",
      minimap: { enabled: false },
      fontSize: 13,
      fontFamily: "'Cascadia Code','Fira Code',Consolas,monospace",
      fontLigatures: true,
      scrollBeyondLastLine: false,
      automaticLayout: true,
      tabSize: 2,
      padding: { top: 8, bottom: 8 },
      quickSuggestions: { strings: true },
    };

    // className="…" completion data, from the CSS engine in force (Settings →
    // Fromcubes): classes with their swatch colours and modifiers, and the
    // variants. Refetched every time a dialog or the React Editor opens and
    // after the engine changes — the engine can change while the editor is
    // open, so "load once" would keep offering the old engine's classes.
    window.__fcCssClasses = null;
    window.__fcCssData = null;
    window.__fcCssEngine = null;
    let cssClassesPending = false;
    window.__fcRefreshCssClasses = function () {
      if (cssClassesPending) return;
      cssClassesPending = true;
      $.getJSON("fromcubes-react/css-classes", function (data) {
        if (!data || !Array.isArray(data.classes)) return;
        const prev = window.__fcCssData;
        window.__fcCssEngine = data.engine;
        window.__fcCssClasses = data.classes;
        window.__fcCssData = {
          engine: data.engine,
          classes: data.classes,
          colors: data.colors || [],
          modifiers: data.modifiers || [],
          classModifiers: data.classModifiers || [],
          variants: data.variants || [],
          describe: data.describe === true,
          canonical: data.canonical === true,
        };
        // What the engine said about classes stays true while it is the same
        // engine; a refetch on every dialog open must not ask again.
        if (prev && prev.engine === data.engine && prev._described) {
          Object.defineProperty(window.__fcCssData, "_described", { value: prev._described });
          Object.defineProperty(window.__fcCssData, "_canonical", { value: prev._canonical });
        }
        if (window.__fcRevalidateCss) window.__fcRevalidateCss();
      })
        .fail(function (xhr) {
          console.error("[FC-Monaco] css-classes FAILED:", xhr.status, xhr.statusText);
        })
        .always(function () {
          cssClassesPending = false;
        });
    };
    let jsxSetupDone = false;

    /**
     * One-time Monaco setup: compiler opts, diagnostics, extra libs,
     * completion providers (CSS class — from the engine in force, JSX tag, utility symbol).
     * Idempotent — safe to call multiple times, only the first call wires
     * up listeners; subsequent calls just re-apply the compiler/diagnostics
     * blocks because Node-RED resets them whenever the editor reloads.
     *
     * @returns {void}
     * @private
     */
    function ensureJsxSetup() {
      if (jsxSetupDone) {
        console.log(
          PREFIX,
          "ensureJsxSetup: already done, re-applying compiler+diag only",
        );
        // Always re-apply compiler/diag in case Node-RED reset them
        applyCompilerAndDiag();
        return;
      }
      jsxSetupDone = true;

      const jsDef = monaco.typescript.javascriptDefaults;

      // Log initial state
      console.log(
        PREFIX,
        "INITIAL compilerOptions:",
        JSON.stringify(jsDef.getCompilerOptions()),
      );
      console.log(
        PREFIX,
        "INITIAL diagnosticsOptions:",
        JSON.stringify(jsDef.getDiagnosticsOptions()),
      );

      applyCompilerAndDiag();

      // Global type stubs
      const libContent = [
        "declare const React: any;",
        "declare const ReactDOM: any;",
        "declare function useNodeRed(): { data: any; send: (payload: any, topic?: string) => void; user: { userId: string; login?: string; displayName?: string; email?: string; role?: string; groups: string[] } | null; portalClient: string | null; authRequired: boolean };",
      ].join("\n");
      console.log(PREFIX, "addExtraLib globals.d.ts");
      jsDef.addExtraLib(libContent, "file:///globals.d.ts");

      // className completion, hover and CSS preview — Tailwind CSS
      // IntelliSense's logic (editor/class-completion.js) over the data of the
      // CSS engine in force. Inside className="…" / className={…} it offers
      // what IntelliSense offers: variants first (`hover:` reopens the list),
      // then every class in the engine's order with colour swatches, and after
      // `/` the class's modifiers. Strings elsewhere complete too once they
      // hold a known class — this editor's addition.
      console.log(PREFIX, "registering CSS class completion provider");
      const cssKinds = {
        variant: monaco.languages.CompletionItemKind.Module,
        color: monaco.languages.CompletionItemKind.Color,
        constant: monaco.languages.CompletionItemKind.Constant,
      };

      function cssData() {
        const cc = window.__fcClassCompletion;
        const data = window.__fcCssData;
        if (!cc || !data || !data.classes.length) return null;
        return cc.prepare(data);
      }

      // What the engine says about each candidate (CSS, summary, colour,
      // conflict rules), or null — one request per batch, answers kept for
      // the data's lifetime. Fast: hovers and the detail pane wait for it.
      function describeCss(data, candidates) {
        return askCssEngine(data, data.describe, "css-describe", data._described, candidates, 5000);
      }

      // Canonical spellings, for the diagnostic only: the engine may take its
      // time (the Tailwind add-on's worker builds an index on its first
      // answer), so nothing else waits for these.
      function canonicalCss(data, candidates) {
        return askCssEngine(data, data.canonical, "css-canonical", data._canonical, candidates, 30000);
      }

      const cssInflight = new WeakMap(); // answer cache → candidate → pending request

      function askCssEngine(data, supported, route, cache, candidates, timeout) {
        const cc = window.__fcClassCompletion;
        const nulls = candidates.map(function () {
          return null;
        });
        if (!supported) return Promise.resolve(nulls);
        // Classes already asked about and not answered yet are waited for,
        // not asked again — typing while the first answer is slow would
        // otherwise queue the same classes over and over.
        let inflight = cssInflight.get(cache);
        if (!inflight) cssInflight.set(cache, (inflight = new Map()));
        const waiting = [];
        const missing = candidates.filter(function (c, i) {
          if (cache.has(c) || candidates.indexOf(c) !== i) return false;
          if (inflight.has(c)) {
            waiting.push(inflight.get(c));
            return false;
          }
          return true;
        });
        const batches = [];
        for (let i = 0; i < missing.length; i += cc.MAX_DESCRIBE) {
          batches.push(missing.slice(i, i + cc.MAX_DESCRIBE));
        }
        const asked = batches.map(function (batch) {
          const request = new Promise(function (resolve) {
            $.ajax({
              url: "fromcubes-react/" + route,
              data: { c: batch.join("\n") },
              dataType: "json",
              timeout: timeout,
            })
              .done(function (res) {
                if (res && Array.isArray(res.results) && res.engine === data.engine) {
                  batch.forEach(function (c, i) {
                    cache.set(c, res.results[i] || null);
                  });
                }
              })
              .fail(function (xhr) {
                console.error(PREFIX, route + " FAILED:", xhr.status, xhr.statusText);
              })
              .always(function () {
                batch.forEach(function (c) {
                  inflight.delete(c);
                });
                resolve();
              });
          });
          batch.forEach(function (c) {
            inflight.set(c, request);
          });
          return request;
        });
        return Promise.all(asked.concat(waiting)).then(function () {
          return candidates.map(function (c) {
            return cache.has(c) ? cache.get(c) : null;
          });
        });
      }

      // A variant the data does not list by name (`group-hover/item`,
      // `data-[open]`) is valid when the engine compiles it — IntelliSense's
      // test, `<part>:[color:red]`.
      function isValidVariant(data, part) {
        if (!window.__fcClassCompletion.mayBeVariant(data, part)) return false;
        return describeCss(data, [part + ":[color:red]"]).then(function (r) {
          return !!r[0];
        });
      }

      // Text the class-list scan needs: up to SEARCH_RANGE before the cursor,
      // and the cursor's line split at the cursor.
      function cssScanText(model, position) {
        const cc = window.__fcClassCompletion;
        const offset = model.getOffsetAt(position);
        const from = model.getPositionAt(Math.max(0, offset - cc.SEARCH_RANGE));
        const line = model.getLineContent(position.lineNumber);
        return {
          before: model.getValueInRange({
            startLineNumber: from.lineNumber,
            startColumn: from.column,
            endLineNumber: position.lineNumber,
            endColumn: position.column,
          }),
          lineBefore: line.substring(0, position.column - 1),
          lineAfter: line.substring(position.column - 1),
        };
      }

      function cssFence(css) {
        return { value: "```css\n" + css + "\n```" };
      }

      monaco.languages.registerCompletionItemProvider("javascript", {
        triggerCharacters: window.__fcClassCompletion
          ? window.__fcClassCompletion.TRIGGER_CHARACTERS
          : ['"', "'", "`", " ", ".", "(", "[", "]", "!", "/", "-", ":"],
        provideCompletionItems: function (model, position, context) {
          const data = cssData();
          if (!data) return { suggestions: [] };
          const cc = window.__fcClassCompletion;
          const text = cssScanText(model, position);
          const at = cc.classListAt(data, text.before, text.lineBefore);
          if (!at) return { suggestions: [] };
          const kinds = monaco.languages.CompletionTriggerKind;
          const ctx = {
            triggerKind:
              context.triggerKind === kinds.Invoke
                ? "invoke"
                : context.triggerKind === kinds.TriggerCharacter
                  ? "character"
                  : "incomplete",
            triggerCharacter: context.triggerCharacter,
          };
          return cc
            .completionsFromClassList(data, at.classList, ctx, function (part) {
              return isValidVariant(data, part);
            })
            .then(function (list) {
              if (!list.modifiers) return list;
              return describeCss(
                data,
                list.items.map(function (item) {
                  return item.label;
                }),
              ).then(function (described) {
                cc.applyModifierColors(list.items, described);
                return list;
              });
            })
            .then(function (list) {
              const range = {
                startLineNumber: position.lineNumber,
                endLineNumber: position.lineNumber,
                startColumn: position.column + list.range.start,
                endColumn: position.column + list.range.end,
              };
              const owner = { variants: list.variants, important: list.important };
              const suggestions = list.items.map(function (item) {
                const s = {
                  label: item.label,
                  kind: cssKinds[item.kind],
                  insertText: item.insertText || item.label,
                  sortText: item.sortText,
                  range: range,
                };
                if (item.filterText) s.filterText = item.filterText;
                if (item.detail) s.detail = item.detail;
                if (item.documentation) s.documentation = item.documentation;
                if (item.snippet) {
                  s.insertTextRules = monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet;
                }
                if (item.retrigger) s.command = { id: "editor.action.triggerSuggest", title: "" };
                if (item.kind !== "variant") s.fcClassOwner = owner;
                return s;
              });
              console.log(
                PREFIX,
                "CSS class completion: ctx=" +
                  (at.attribute ? "attribute" : "string") +
                  " items=" +
                  suggestions.length,
              );
              return { suggestions: suggestions };
            });
        },
        // The detail pane: the declarations on one line, and the CSS the
        // class generates under the variants typed before it.
        resolveCompletionItem: function (item) {
          const data = cssData();
          if (!data || !item.fcClassOwner || (item.detail && item.documentation)) return item;
          const className = item.fcClassOwner.important ? "!" + item.label : item.label;
          const full = item.fcClassOwner.variants.concat([className]).join(":");
          return describeCss(data, [full, className]).then(function (r) {
            const whole = r[0];
            const base = r[1];
            if (!whole) return item;
            if (!item.detail) {
              item.detail = /^\d+ rules$/.test(whole.detail || "") ? whole.detail : (base || whole).detail || undefined;
            }
            if (!item.documentation && whole.documentation) item.documentation = cssFence(whole.documentation);
            return item;
          });
        },
      });

      monaco.languages.registerHoverProvider("javascript", {
        provideHover: function (model, position) {
          const data = cssData();
          if (!data || !data.describe) return null;
          const text = cssScanText(model, position);
          const hit = window.__fcClassCompletion.classNameAt(data, text.before, text.lineBefore, text.lineAfter);
          if (!hit) return null;
          return describeCss(data, [hit.className]).then(function (r) {
            if (!r[0] || !r[0].hover) return null;
            return {
              range: {
                startLineNumber: position.lineNumber,
                endLineNumber: position.lineNumber,
                startColumn: position.column + hit.start,
                endColumn: position.column + hit.end,
              },
              contents: [cssFence(r[0].hover)],
            };
          });
        },
      });

      // Diagnostics, quick fixes and colour squares — IntelliSense's
      // cssConflict and suggestCanonicalClasses warnings and its document
      // colours, over every class attribute of every javascript model (node
      // dialogs and the React Editor alike), rechecked as the code changes.
      function cssRange(model, start, end) {
        const a = model.getPositionAt(start);
        const b = model.getPositionAt(end);
        return { startLineNumber: a.lineNumber, startColumn: a.column, endLineNumber: b.lineNumber, endColumn: b.column };
      }

      function cssClassLists(model) {
        const cc = window.__fcClassCompletion;
        return cc.findClassListsInText(cc.jsWithoutComments(model.getValue()));
      }

      const CSS_MARKER_OWNER = "tailwindcss";
      const cssDiagnostics = new WeakMap(); // model → diagnostics, for their quick fixes
      const cssTimers = new WeakMap();

      function validateCss(model) {
        if (model.isDisposed() || model.getLanguageId() !== "javascript") return;
        const data = cssData();
        if (!data || !data.describe) {
          cssDiagnostics.delete(model);
          monaco.editor.setModelMarkers(model, CSS_MARKER_OWNER, []);
          return;
        }
        const cc = window.__fcClassCompletion;
        const version = model.getVersionId();
        const lists = cssClassLists(model);
        const names = cc.uniqueClassNames(lists);
        // Conflicts as soon as the classes are described; canonical
        // suggestions join when the engine has them — a slow first answer
        // never holds back the rest.
        describeCss(data, names).then(function () {
          publishCssMarkers(model, version, data, lists);
          canonicalCss(data, names).then(function () {
            publishCssMarkers(model, version, data, lists);
          });
        });
      }

      function publishCssMarkers(model, version, data, lists) {
        if (model.isDisposed() || model.getVersionId() !== version || cssData() !== data) return;
        const diagnostics = window.__fcClassCompletion.diagnose(lists, data._described, data._canonical);
        cssDiagnostics.set(model, diagnostics);
        monaco.editor.setModelMarkers(
          model,
          CSS_MARKER_OWNER,
          diagnostics.map(function (d) {
            return Object.assign(cssRange(model, d.start, d.end), {
              severity: d.severity === "error" ? monaco.MarkerSeverity.Error : monaco.MarkerSeverity.Warning,
              message: d.message,
              source: "tailwindcss",
              code: d.code,
              relatedInformation: d.related.map(function (r) {
                return Object.assign(cssRange(model, r.start, r.end), { resource: model.uri, message: r.message });
              }),
            });
          }),
        );
      }

      function scheduleCssValidation(model) {
        clearTimeout(cssTimers.get(model));
        cssTimers.set(
          model,
          setTimeout(function () {
            validateCss(model);
          }, 400),
        );
      }

      function watchCssModel(model) {
        const changed = model.onDidChangeContent(function () {
          scheduleCssValidation(model);
        });
        const language = model.onDidChangeLanguage(function () {
          scheduleCssValidation(model);
        });
        model.onWillDispose(function () {
          changed.dispose();
          language.dispose();
          clearTimeout(cssTimers.get(model));
        });
        scheduleCssValidation(model);
      }

      monaco.editor.getModels().forEach(watchCssModel);
      monaco.editor.onDidCreateModel(watchCssModel);
      // New engine data (a dialog opened, the engine switched): check again.
      window.__fcRevalidateCss = function () {
        monaco.editor.getModels().forEach(scheduleCssValidation);
      };

      monaco.languages.registerCodeActionProvider("javascript", {
        provideCodeActions: function (model, _range, context) {
          const diagnostics = cssDiagnostics.get(model) || [];
          const actions = [];
          context.markers.forEach(function (marker) {
            if (marker.source !== "tailwindcss") return;
            const start = model.getOffsetAt({ lineNumber: marker.startLineNumber, column: marker.startColumn });
            const end = model.getOffsetAt({ lineNumber: marker.endLineNumber, column: marker.endColumn });
            diagnostics.forEach(function (d) {
              if (d.start !== start || d.end !== end || d.code !== marker.code || d.message !== marker.message) return;
              d.fixes.forEach(function (fix) {
                actions.push({
                  title: fix.title,
                  kind: "quickfix",
                  diagnostics: [marker],
                  edit: {
                    edits: [
                      {
                        resource: model.uri,
                        versionId: model.getVersionId(),
                        textEdit: { range: cssRange(model, fix.start, fix.end), text: fix.text },
                      },
                    ],
                  },
                });
              });
            });
          });
          return { actions: actions, dispose: function () {} };
        },
      });

      monaco.languages.registerColorProvider("javascript", {
        provideDocumentColors: function (model) {
          const data = cssData();
          if (!data) return [];
          const cc = window.__fcClassCompletion;
          const lists = cssClassLists(model);
          return describeCss(data, cc.classesNeedingColor(data, lists)).then(function () {
            if (model.isDisposed()) return [];
            return cc.documentColors(data, lists, data._described).map(function (c) {
              return { color: c.color, range: cssRange(model, c.start, c.end) };
            });
          });
        },
        // Only an arbitrary colour (`bg-[#f00]`) takes one back from the picker.
        provideColorPresentations: function (model, info) {
          const className = model.getValueInRange(info.range);
          return window.__fcClassCompletion.colorPresentations(className, info.color).map(function (label) {
            return { label: label, textEdit: { range: info.range, text: label } };
          });
        },
      });

      // JSX/HTML tag completion — type tag name, Tab → <tag>|</tag>
      console.log(PREFIX, "registering JSX tag completion provider");
      const HTML_TAGS = [
        "div",
        "span",
        "p",
        "a",
        "button",
        "input",
        "img",
        "form",
        "label",
        "h1",
        "h2",
        "h3",
        "h4",
        "h5",
        "h6",
        "ul",
        "ol",
        "li",
        "dl",
        "dt",
        "dd",
        "table",
        "thead",
        "tbody",
        "tfoot",
        "tr",
        "th",
        "td",
        "section",
        "article",
        "aside",
        "header",
        "footer",
        "nav",
        "main",
        "strong",
        "em",
        "b",
        "i",
        "u",
        "s",
        "small",
        "mark",
        "code",
        "pre",
        "blockquote",
        "br",
        "hr",
        "wbr",
        "select",
        "option",
        "optgroup",
        "textarea",
        "fieldset",
        "legend",
        "details",
        "summary",
        "dialog",
        "canvas",
        "video",
        "audio",
        "source",
        "picture",
        "figure",
        "figcaption",
        "svg",
        "path",
        "circle",
        "rect",
        "line",
        "g",
        "defs",
        "use",
        "text",
      ];
      const VOID_TAGS = new Set(["br", "hr", "img", "input", "wbr", "source"]);

      monaco.languages.registerCompletionItemProvider("javascript", {
        triggerCharacters: ["<"],
        provideCompletionItems: function (model, position) {
          const line = model.getLineContent(position.lineNumber);
          const before = line.substring(0, position.column - 1);

          // After "<" — suggest tags
          const afterBracket = before.match(/<([a-zA-Z]*)$/);
          // Bare word at line start or after whitespace/{ — Emmet-like (lower or upper)
          const bareWord =
            !afterBracket &&
            before.match(/(?:^|[\s{(,])([a-zA-Z][a-zA-Z0-9]*)$/);

          if (!afterBracket && !bareWord) return { suggestions: [] };

          const typed = (afterBracket ? afterBracket[1] : bareWord[1]) || "";
          const replaceStart =
            position.column - typed.length - (afterBracket ? 1 : 0);

          const range = {
            startLineNumber: position.lineNumber,
            endLineNumber: position.lineNumber,
            startColumn: replaceStart,
            endColumn: position.column,
          };

          const suggestions = [];
          const seen = new Set();

          // Monaco filters a suggestion against the text its range replaces.
          // After "<" that text is "<Rac", so a plain "Rack" label never
          // matches and the item is dropped before it is ever shown — the
          // list appears on "<" and empties as soon as you type a letter.
          // filterText restates the label the way the range sees it.
          const filterFor = function (label) {
            return afterBracket ? "<" + label : label;
          };

          // HTML tags
          for (let i = 0; i < HTML_TAGS.length; i++) {
            const tag = HTML_TAGS[i];
            if (typed && tag.indexOf(typed) !== 0) continue;
            seen.add(tag);
            if (VOID_TAGS.has(tag)) {
              suggestions.push({
                label: tag,
                kind: monaco.languages.CompletionItemKind.Property,
                insertText: "<" + tag + " $0/>",
                insertTextRules:
                  monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                range: range,
                filterText: filterFor(tag),
                detail: "<" + tag + " />",
                sortText: "0" + tag,
              });
            } else {
              suggestions.push({
                label: tag,
                kind: monaco.languages.CompletionItemKind.Property,
                insertText: "<" + tag + ">$0</" + tag + ">",
                insertTextRules:
                  monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                range: range,
                filterText: filterFor(tag),
                detail: "<" + tag + ">…</" + tag + ">",
                sortText: "0" + tag + "a",
              });
              suggestions.push({
                label: tag,
                kind: monaco.languages.CompletionItemKind.Property,
                insertText: "<" + tag + " $0/>",
                insertTextRules:
                  monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                range: range,
                filterText: filterFor(tag),
                detail: "<" + tag + " />",
                sortText: "0" + tag + "b",
              });
            }
          }

          // Custom components from registry (PascalCase)
          const upperMatch =
            afterBracket && before.match(/<([A-Z][a-zA-Z0-9]*)$/);
          const bareUpper =
            !afterBracket && before.match(/(?:^|[\s{(,])([A-Z][a-zA-Z0-9]*)$/);
          const compTyped = upperMatch
            ? upperMatch[1]
            : bareUpper
              ? bareUpper[1]
              : "";

          if (compTyped || (!typed && afterBracket)) {
            // Fetch component names from registry (cached on window)
            const reg = window.__fcComponentNames || [];
            for (let c = 0; c < reg.length; c++) {
              const name = reg[c];
              if (seen.has(name)) continue;
              if (compTyped && name.indexOf(compTyped) !== 0) continue;
              if (
                !compTyped &&
                typed &&
                name.toLowerCase().indexOf(typed) !== 0
              )
                continue;
              seen.add(name);
              suggestions.push({
                label: name,
                kind: monaco.languages.CompletionItemKind.Class,
                insertText: "<" + name + ">$0</" + name + ">",
                insertTextRules:
                  monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                range: range,
                filterText: filterFor(name),
                detail: "<" + name + ">…</" + name + ">",
                sortText: "0" + name + "a",
              });
              suggestions.push({
                label: name,
                kind: monaco.languages.CompletionItemKind.Class,
                insertText: "<" + name + " $0/>",
                insertTextRules:
                  monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                range: range,
                filterText: filterFor(name),
                detail: "<" + name + " />",
                sortText: "0" + name + "b",
              });
            }
            // Any PascalCase word not in registry — offer generic JSX wrap.
            // While a name is half-typed this can outrank the real component:
            // Monaco scores an exact filter match above a prefix one, and
            // sortText does not override that. It disappears as soon as the
            // name is complete, because then `seen` already holds it.
            if (compTyped && !seen.has(compTyped)) {
              suggestions.push({
                label: compTyped,
                kind: monaco.languages.CompletionItemKind.Class,
                insertText: "<" + compTyped + ">$0</" + compTyped + ">",
                insertTextRules:
                  monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                range: range,
                filterText: filterFor(compTyped),
                detail: "<" + compTyped + ">…</" + compTyped + ">",
                sortText: "0" + compTyped + "a",
              });
              suggestions.push({
                label: compTyped,
                kind: monaco.languages.CompletionItemKind.Class,
                insertText: "<" + compTyped + " $0/>",
                insertTextRules:
                  monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                range: range,
                filterText: filterFor(compTyped),
                detail: "<" + compTyped + " />",
                sortText: "0" + compTyped + "b",
              });
            }
          }

          console.log(
            PREFIX,
            "JSX tag completion: typed='" +
              typed +
              "', suggestions=" +
              suggestions.length,
          );
          return { suggestions: suggestions };
        },
      });

      // Collapse <tag>|</tag> → <tag /> when "/" typed inside empty tag pair
      console.log(PREFIX, "registering JSX self-close collapse handler");
      window.__fcAttachSelfClose = function (editor) {
        editor.onDidChangeModelContent(function (e) {
          if (e.changes.length !== 1) return;
          const ch = e.changes[0];
          if (ch.text !== "/") return;
          const model = editor.getModel();
          if (!model) return;
          const lineNum = ch.range.startLineNumber;
          const line = model.getLineContent(lineNum);
          // Pattern 1: <tag>/</tag>  (cursor was between > and </)
          // Pattern 2: <tag/></tag>  (cursor was before > in opening tag)
          let m = line.match(/^(.*)<([a-zA-Z][a-zA-Z0-9]*)>\/<\/\2>(.*)$/);
          let matchStr, tag, prefix;
          if (m) {
            prefix = m[1];
            tag = m[2];
            matchStr = "<" + tag + ">/</" + tag + ">";
          } else {
            m = line.match(/^(.*)<([a-zA-Z][a-zA-Z0-9]*)\/><\/\2>(.*)$/);
            if (!m) return;
            prefix = m[1];
            tag = m[2];
            matchStr = "<" + tag + "/></" + tag + ">";
          }
          const startCol = prefix.length + 1;
          const endCol = startCol + matchStr.length;
          const replacement = "<" + tag + " />";
          const cursorCol = startCol + replacement.length - 2;
          setTimeout(function () {
            editor.executeEdits("self-close-collapse", [
              {
                range: {
                  startLineNumber: lineNum,
                  endLineNumber: lineNum,
                  startColumn: startCol,
                  endColumn: endCol,
                },
                text: replacement,
              },
            ]);
            editor.setPosition({ lineNumber: lineNum, column: cursorCol });
          }, 0);
        });
        console.log(PREFIX, "self-close collapse attached to editor");
      };

      /**
       * Report the JSX context at `offset` in `code`. Client-side mirror of
       * the JSX-aware scanner in lib/helpers.js (stripComments) — keep the
       * two in sync.
       *
       *   "js"       – plain JS / `{…}` expression  → `//` comments work
       *   "tag"      – inside an opening `<Tag …>`  → `//` comments work
       *   "children" – between `<Tag…>` and `</Tag>` → only `{/* … *​/}`
       *                works; `//` there is literal text that esbuild renders
       *
       * @param {string} code
       * @param {number} offset
       * @returns {"js"|"tag"|"children"}
       */
      window.__fcJsxContextAt = function (code, offset) {
        const n = Math.min(code.length, offset);
        const stack = [{ t: "js", depth: 0 }];
        let prev = "";
        let prev2 = "";
        let word = "";
        let prevIdent = false;
        const IDENT_CH = /[A-Za-z0-9_$]/;
        function sig(ch) {
          prev2 = prev;
          prev = ch;
          if (IDENT_CH.test(ch)) {
            word = prevIdent ? word + ch : ch;
            prevIdent = true;
          } else {
            word = "";
            prevIdent = false;
          }
        }
        const KW = new Set([
          "return",
          "case",
          "typeof",
          "do",
          "else",
          "void",
          "yield",
          "await",
          "in",
          "of",
          "new",
          "delete",
          "throw",
          "instanceof",
        ]);
        function startsJsx(next) {
          if (!/[A-Za-z_$>]/.test(next)) return false;
          if (prev === "") return true;
          if (prev === "<") return false;
          if (/[A-Za-z0-9_$)\]}"'`]/.test(prev)) return KW.has(word);
          if (prev === ">") return prev2 === "=";
          return true;
        }
        function poppedIntoJs() {
          if (stack[stack.length - 1].t === "js") {
            prev = ")";
            prev2 = "";
            word = "";
            prevIdent = false;
          }
        }
        function enterExpr() {
          stack.push({ t: "js", depth: 0 });
          prev = "";
          prev2 = "";
          word = "";
          prevIdent = false;
          i++;
        }
        let i = 0;
        while (i < n) {
          const top = stack[stack.length - 1];
          const c = code[i];
          const d = i + 1 < code.length ? code[i + 1] : "";
          if (top.t === "children") {
            if (c === "<" && d === "/") {
              i += 2;
              while (i < code.length && code[i] !== ">") i++;
              i++;
              stack.pop();
              poppedIntoJs();
              continue;
            }
            if (c === "<" && /[A-Za-z_$>]/.test(d)) {
              stack.push({ t: "tag", slash: false });
              i++;
              continue;
            }
            if (c === "{") {
              enterExpr();
              continue;
            }
            i++;
            continue;
          }
          if (top.t === "tag") {
            if (c === '"' || c === "'") {
              i++;
              while (i < code.length && code[i] !== c) i++;
              i++;
              top.slash = false;
              continue;
            }
            if (c === "/" && d === "/") {
              i += 2;
              while (i < code.length && code[i] !== "\n") i++;
              continue;
            }
            if (c === "/" && d === "*") {
              i += 2;
              while (
                i < code.length &&
                !(code[i] === "*" && code[i + 1] === "/")
              )
                i++;
              i += 2;
              continue;
            }
            if (c === "{") {
              enterExpr();
              continue;
            }
            if (c === ">") {
              const selfClose = top.slash;
              stack.pop();
              if (selfClose) poppedIntoJs();
              else stack.push({ t: "children" });
              i++;
              continue;
            }
            if (!/\s/.test(c)) top.slash = c === "/";
            i++;
            continue;
          }
          // js frame
          if (c === '"' || c === "'" || c === "`") {
            const q = c;
            i++;
            while (i < code.length && code[i] !== q) {
              if (code[i] === "\\") i++;
              i++;
            }
            i++;
            sig(q);
            continue;
          }
          if (c === "/" && d === "/") {
            i += 2;
            while (i < code.length && code[i] !== "\n") i++;
            continue;
          }
          if (c === "/" && d === "*") {
            i += 2;
            while (
              i < code.length &&
              !(code[i] === "*" && code[i + 1] === "/")
            )
              i++;
            i += 2;
            continue;
          }
          if (c === "{") {
            top.depth++;
            sig(c);
            i++;
            continue;
          }
          if (c === "}") {
            if (top.depth === 0 && stack.length > 1) {
              stack.pop();
              if (stack[stack.length - 1].t === "tag")
                stack[stack.length - 1].slash = false;
              i++;
              continue;
            }
            if (top.depth > 0) top.depth--;
            sig(c);
            i++;
            continue;
          }
          if (c === "<" && startsJsx(d)) {
            stack.push({ t: "tag", slash: false });
            i++;
            continue;
          }
          if (/\s/.test(c)) {
            prevIdent = false;
            i++;
            continue;
          }
          sig(c);
          i++;
        }
        return stack[stack.length - 1].t;
      };

      // Custom keybindings shared by every Monaco instance in this package.
      //
      // Ctrl+D (Cmd+D on macOS) duplicates the current line / selection by
      // delegating to Monaco's built-in copyLinesDownAction (multi-cursor
      // aware, single undo step). Overrides Monaco's default Ctrl+D
      // ("Add Selection To Next Find Match") on purpose.
      //
      // Ctrl+/ (Cmd+/) toggles comments JSX-aware: Monaco's built-in
      // commentLine blindly prefixes `//`, which inside JSX children is NOT
      // a comment — esbuild renders it as literal text and the "commented"
      // element stays live. The comment style for the whole selection comes
      // from the FIRST selected line's context via __fcJsxContextAt:
      // children → wrap each line in `{/* … *​/}`, JS / opening-tag
      // attributes → `//`. Non-javascript models (the custom-head HTML
      // editor) fall through to the built-in action.
      window.__fcAttachKeybindings = function (editor) {
        editor.addAction({
          id: "fc-duplicate-line",
          label: "Duplicate Line/Selection",
          keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyD],
          run: function (ed) {
            const action = ed.getAction("editor.action.copyLinesDownAction");
            if (action) action.run();
          },
        });
        editor.addAction({
          id: "fc-jsx-toggle-comment",
          label: "Toggle Line Comment (JSX-aware)",
          keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyCode.Slash],
          run: function (ed) {
            const model = ed.getModel();
            if (!model) return;
            if (model.getLanguageId() !== "javascript") {
              const action = ed.getAction("editor.action.commentLine");
              if (action) action.run();
              return;
            }
            const lineNums = new Set();
            (ed.getSelections() || []).forEach(function (sel) {
              let end = sel.endLineNumber;
              // a selection ending at column 1 does not include that line
              if (end > sel.startLineNumber && sel.endColumn === 1) end--;
              for (let l = sel.startLineNumber; l <= end; l++)
                lineNums.add(l);
            });
            const text = model.getValue();
            const lines = [];
            lineNums.forEach(function (l) {
              const content = model.getLineContent(l);
              const t = content.trim();
              if (!t) return;
              const wrapped = t.startsWith("{/*") && t.endsWith("*/}");
              const slashed = !wrapped && t.startsWith("//");
              lines.push({
                l: l,
                content: content,
                t: t,
                wrapped: wrapped,
                slashed: slashed,
              });
            });
            if (!lines.length) return;
            lines.sort(function (a, b) {
              return a.l - b.l;
            });
            const uncomment = lines.every(function (x) {
              return x.wrapped || x.slashed;
            });
            // Comment style comes from the FIRST selected line's context
            // (VS Code behavior): a selection starting at `return (` is JS,
            // so the whole block gets `//` — once the outer lines are
            // commented the inner JSX never parses. Only a selection that
            // STARTS between live tags needs `{/* … */}`.
            // Markers are inserted at ONE column for the whole selection —
            // the minimum indent across the selected lines — so they line
            // up and each line keeps its own indentation after the marker.
            let ctx = null;
            let minIndent = 0;
            if (!uncomment) {
              const first = lines[0];
              const firstIndent =
                first.content.length - first.content.trimStart().length;
              ctx = window.__fcJsxContextAt(
                text,
                model.getOffsetAt({
                  lineNumber: first.l,
                  column: firstIndent + 1,
                }),
              );
              minIndent = Infinity;
              lines.forEach(function (x) {
                const ind = x.content.length - x.content.trimStart().length;
                if (ind < minIndent) minIndent = ind;
              });
            }
            const edits = [];
            lines.forEach(function (x) {
              let newText = null;
              if (uncomment) {
                const indent = x.content.slice(
                  0,
                  x.content.length - x.content.trimStart().length,
                );
                let inner;
                if (x.wrapped) {
                  inner = x.t.slice(3, -3);
                  if (inner.startsWith(" ")) inner = inner.slice(1);
                  if (inner.endsWith(" ")) inner = inner.slice(0, -1);
                } else {
                  inner = x.t.slice(2);
                  if (inner.startsWith(" ")) inner = inner.slice(1);
                }
                newText = indent + inner;
              } else if (!x.wrapped && !x.slashed) {
                const head = x.content.slice(0, minIndent);
                const rest = x.content.slice(minIndent);
                newText =
                  ctx === "children"
                    ? head + "{/* " + rest + " */}"
                    : head + "// " + rest;
              }
              if (newText !== null)
                edits.push({
                  range: new monaco.Range(
                    x.l,
                    1,
                    x.l,
                    model.getLineMaxColumn(x.l),
                  ),
                  text: newText,
                  forceMoveMarkers: true,
                });
            });
            if (!edits.length) return;
            ed.pushUndoStop();
            ed.executeEdits("fc-jsx-toggle-comment", edits);
            ed.pushUndoStop();
          },
        });
      };

      /**
       * Fetch the current component registry from `/fromcubes-react/registry`
       * and stash the names on `window.__fcComponentNames` so the JSX-tag
       * completion provider can offer `<Button` etc. Re-fetched on every
       * editor open so newly-added components show up without an editor
       * restart.
       * @returns {void}
       * @private
       */
      function refreshComponentNames() {
        $.getJSON("fromcubes-react/registry", function (reg) {
          window.__fcComponentNames = Object.keys(reg);
          console.log(
            PREFIX,
            "component names loaded:",
            window.__fcComponentNames,
          );
        }).fail(function () {
          window.__fcComponentNames = [];
        });
      }
      refreshComponentNames();
      // Exposed for the workspace overlay, which reopens files without going
      // through any node's oneditprepare.
      window.__fcRefreshComponentNames = refreshComponentNames;

      // Fetch utility nodes + their parsed top-level symbols.
      // Window cache shape: { byNode: { utilName: [symbol, ...] }, allSymbols: [..] }
      window.__fcRefreshUtilities = function () {
        $.getJSON("fromcubes-react/utilities", function (reg) {
          const byNode = {};
          const all = new Set();
          Object.keys(reg).forEach(function (n) {
            const syms = reg[n].symbols || [];
            byNode[n] = syms;
            syms.forEach(function (s) { all.add(s); });
          });
          window.__fcUtilities = { byNode: byNode, allSymbols: [...all] };
          console.log(
            PREFIX,
            "utilities loaded: " + Object.keys(byNode).length + " nodes, " + all.size + " symbols",
          );
        }).fail(function () {
          window.__fcUtilities = { byNode: {}, allSymbols: [] };
        });
      };
      window.__fcRefreshUtilities();

      // Utility-symbol completion: suggests bare identifiers anywhere in JS
      // context EXCEPT after "<" (that's JSX tag completion, handled below).
      monaco.languages.registerCompletionItemProvider("javascript", {
        triggerCharacters: ["."], // jQuery-ish — but we mostly fire from word context
        provideCompletionItems: function (model, position) {
          const line = model.getLineContent(position.lineNumber);
          const before = line.substring(0, position.column - 1);
          // Skip JSX tag context — covered by other providers
          if (/<[a-zA-Z]*$/.test(before)) return { suggestions: [] };
          // Skip property access — let Monaco's language service handle it
          if (/\.\s*\w*$/.test(before)) return { suggestions: [] };
          // Skip inside strings
          if (/["'`][^"'`]*$/.test(before)) return { suggestions: [] };
          const wordMatch = before.match(/([A-Za-z_$][\w$]*)$/);
          const word = wordMatch ? wordMatch[1] : "";
          const all = (window.__fcUtilities && window.__fcUtilities.allSymbols) || [];
          if (!all.length) return { suggestions: [] };
          const range = {
            startLineNumber: position.lineNumber,
            endLineNumber: position.lineNumber,
            startColumn: position.column - word.length,
            endColumn: position.column,
          };
          const suggestions = [];
          for (let i = 0; i < all.length; i++) {
            const sym = all[i];
            if (word && sym.indexOf(word) !== 0) continue;
            suggestions.push({
              label: sym,
              kind: monaco.languages.CompletionItemKind.Function,
              insertText: sym,
              range: range,
              detail: "fc-portal-utility",
              sortText: "1" + sym,
            });
          }
          return { suggestions: suggestions };
        },
      });

      // Marker listener for debugging
      monaco.editor.onDidChangeMarkers(function (uris) {
        uris.forEach(function (uri) {
          const markers = monaco.editor.getModelMarkers({ resource: uri });
          if (markers.length > 0) {
            console.group(PREFIX + " MARKERS on " + uri.toString());
            markers.forEach(function (m) {
              console.log(
                "  code=" +
                  (m.code || "?") +
                  " severity=" +
                  m.severity +
                  " source=" +
                  (m.source || "?") +
                  " msg=" +
                  m.message +
                  " [L" +
                  m.startLineNumber +
                  ":" +
                  m.startColumn +
                  "]",
              );
            });
            console.groupEnd();
          }
        });
      });

      console.log(PREFIX, "one-time setup complete");
    }

    /**
     * Push compilerOptions + diagnosticsOptions into Monaco's TS defaults.
     * Called by `ensureJsxSetup` once and re-applied on every editor open
     * because Node-RED's outer Monaco initialiser can reset these between
     * editor sessions. We disable Monaco's TS-side squiggles entirely —
     * the authoritative syntax check is the server-side esbuild pass at
     * deploy time, and Monaco's TS parser produces noisy false positives
     * (1109/1005/1128) on raw JSX.
     * @returns {void}
     * @private
     */
    function applyCompilerAndDiag() {
      const jsDef = monaco.typescript.javascriptDefaults;
      const compilerOpts = {
        jsx: monaco.typescript.JsxEmit.React,
        target: monaco.typescript.ScriptTarget.ESNext,
        module: monaco.typescript.ModuleKind.ESNext,
        allowNonTsExtensions: true,
        allowJs: true,
      };
      console.log(PREFIX, "setCompilerOptions:", JSON.stringify(compilerOpts));
      jsDef.setCompilerOptions(compilerOpts);

      const diagOpts = {
        noSemanticValidation: true,
        // Server-side esbuild does the real syntax check at deploy time;
        // Monaco's TS parser produces noisy false positives on raw JSX
        // (1109, 1005, 1128 etc.), so we silence its squiggles entirely.
        noSyntaxValidation: true,
        noSuggestionDiagnostics: true,
        diagnosticCodesToIgnore: [17004],
      };
      console.log(PREFIX, "setDiagnosticsOptions:", JSON.stringify(diagOpts));
      jsDef.setDiagnosticsOptions(diagOpts);

      console.log(
        PREFIX,
        "readback compilerOptions:",
        JSON.stringify(jsDef.getCompilerOptions()),
      );
      console.log(
        PREFIX,
        "readback diagnosticsOptions:",
        JSON.stringify(jsDef.getDiagnosticsOptions()),
      );
    }

    /**
     * Re-apply JSX defaults before Monaco model creation. Exported for
     * `oneditprepare` to call. Idempotent — wraps `ensureJsxSetup`.
     * @returns {void}
     */
    window.__fcApplyJsxDefaults = function () {
      ensureJsxSetup();
    };

    /**
     * Lazy-load Monaco from the admin endpoint `/fromcubes-react/vs/` the
     * first time an editor opens. If Monaco is already on `window`
     * (Node-RED bundled its own copy, or another node loaded it first),
     * skip the loader script and run our setup inline.
     *
     * The callback signature is `cb(failed)` — `failed === true` when the
     * loader script threw at load time; editors should fall back to a
     * plain textarea in that case.
     *
     * @param {(failed?: boolean) => void} cb
     * @returns {void}
     */
    window.__fcLoadMonaco = function (cb) {
      console.log(PREFIX, "loadMonaco called, monaco exists:", !!window.monaco);
      if (window.monaco) {
        console.log(
          PREFIX,
          "Monaco already loaded (by Node-RED?), running setup inline",
        );
        ensureJsxSetup();
        cb();
        return;
      }
      const s = document.createElement("script");
      const base = window.__fcAssetBase || "fromcubes-react/";
      s.src = base + "vs/loader.js";
      s.onload = function () {
        console.log(PREFIX, "loader.js loaded, configuring require paths");
        require.config({ paths: { vs: base + "vs" } });
        require(["vs/editor/editor.main"], function () {
          console.log(PREFIX, "editor.main loaded");
          ensureJsxSetup();
          console.log(PREFIX, "calling cb()");
          cb();
        });
      };
      s.onerror = function () {
        console.error(PREFIX, "FAILED to load loader.js");
        cb(true);
      };
      document.head.appendChild(s);
    };
  })();
</script>

<script type="text/javascript">
  (function () {
    let compEditorInstance = null;

    const COMP_STARTER = [
      "function StatusCard({ label, value, unit }) {",
      "  return (",
      '    <div className="rounded-2xl bg-zinc-900 border border-zinc-800 p-6">',
      '      <div className="text-xs text-zinc-500 uppercase tracking-wider mb-1">{label}</div>',
      '      <div className="text-3xl font-bold text-white">',
      '        {value}<span className="text-lg text-zinc-400 ml-1">{unit}</span>',
      "      </div>",
      "    </div>",
      "  );",
      "}",
    ].join("\n");

    // FC_NAME_RE / FC_NAME_MAX / FC_NAME_BLACKLIST mirror lib/helpers.js
    // isSafeName so the editor flags invalid names before deploy.
    const FC_NAME_RE = /^[A-Za-z_$][\w$]*$/;
    const FC_NAME_MAX = 64;
    const FC_NAME_BLACKLIST = [
      "__proto__", "constructor", "prototype", "hasOwnProperty",
      "isPrototypeOf", "propertyIsEnumerable", "toString", "valueOf",
      "toLocaleString",
    ];
    function fcValidateName(v) {
      return (
        typeof v === "string" &&
        v.length > 0 &&
        v.length <= FC_NAME_MAX &&
        FC_NAME_RE.test(v) &&
        FC_NAME_BLACKLIST.indexOf(v) === -1
      );
    }

    RED.nodes.registerType("fc-portal-component", {
      category: "fromcubes",
      color: "#a8d8ea",
      defaults: {
        name: { value: "" },
        compName: {
          value: "StatusCard",
          required: true,
          validate: fcValidateName,
        },
        compCode: {
          value: COMP_STARTER,
          validate: function (v) {
            return typeof v === "string" && v.trim().length > 0;
          },
        },
      },
      inputs: 0,
      outputs: 0,
      icon: "fromcubes-component.svg",
      paletteLabel: "React Component",
      inputLabels: [],
      outputLabels: [],
      /**
       * Canvas label resolver — falls back through `name → compName →
       * "component"` so a freshly-dropped node shows something readable
       * before the user opens the edit dialog.
       * @returns {string}
       */
      label: function () {
        return this.name || this.compName || "component";
      },

      /**
       * Node-RED editor lifecycle: called every time the user opens the
       * edit dialog for this node. Loads Monaco lazily, creates a JSX
       * model with a stable URI (`file:///fc-comp-<nodeId>.jsx`) and
       * attaches it to the `#fcc-monaco` container. Falls back to a
       * `<textarea>` if Monaco fails to load.
       * @returns {void}
       */
      oneditprepare: function () {
        const node = this;
        const code =
          typeof node.compCode === "string" ? node.compCode : COMP_STARTER;
        console.log("[FC-Monaco] COMP oneditprepare, node.id=" + node.id);

        // Hand off to the full-screen React Editor: the dialog saves and
        // closes itself first (its oneditsave owns the same field).
        $("#fcc-btn-react-editor").on("click", function () {
          if (!window.__fcPortalWorkspace) {
            RED.notify("React Editor is not available", "warning");
            return;
          }
          window.__fcPortalWorkspace.openNodeFile(node.id, "compCode");
        });

        window.__fcRefreshCssClasses();

        window.__fcLoadMonaco(function (failed) {
          if (failed) {
            console.error(
              "[FC-Monaco] COMP: Monaco load failed, using fallback textarea",
            );
            $("#fcc-monaco").hide();
            $("#fcc-fallback").show().val(code);
            return;
          }

          console.log(
            "[FC-Monaco] COMP: applying JSX defaults before model creation",
          );
          window.__fcApplyJsxDefaults();

          const compUri = monaco.Uri.parse("file:///fc-comp-" + node.id + ".jsx");
          console.log("[FC-Monaco] COMP: model URI=" + compUri.toString());
          const existingModel = monaco.editor.getModel(compUri);
          if (existingModel) {
            console.log("[FC-Monaco] COMP: disposing existing model");
            existingModel.dispose();
          }
          const compModel = monaco.editor.createModel(
            code,
            "javascript",
            compUri,
          );
          console.log(
            "[FC-Monaco] COMP: model created, language=" +
              compModel.getLanguageId(),
          );

          compEditorInstance = monaco.editor.create(
            document.getElementById("fcc-monaco"),
            Object.assign({ model: compModel }, window.__fcEditorOpts),
          );
          if (window.__fcAttachKeybindings)
            window.__fcAttachKeybindings(compEditorInstance);
          console.log("[FC-Monaco] COMP: editor created");

          // Log markers after a short delay (diagnostics are async)
          setTimeout(function () {
            const markers = monaco.editor.getModelMarkers({ resource: compUri });
            console.log(
              "[FC-Monaco] COMP: markers after 500ms, count=" + markers.length,
            );
            markers.forEach(function (m) {
              console.log(
                "[FC-Monaco] COMP marker: code=" + m.code + " msg=" + m.message,
              );
            });
            // Also log current compiler options state
            console.log(
              "[FC-Monaco] COMP: current compilerOptions:",
              JSON.stringify(
                monaco.typescript.javascriptDefaults.getCompilerOptions(),
              ),
            );
            console.log(
              "[FC-Monaco] COMP: current diagnosticsOptions:",
              JSON.stringify(
                monaco.typescript.javascriptDefaults.getDiagnosticsOptions(),
              ),
            );
          }, 500);
        });
      },

      /**
       * Editor → flow: copy Monaco editor contents into the hidden
       * `#node-input-compCode` input and the node's `compCode` property,
       * then dispose Monaco's model + editor to free GPU/CPU resources.
       * @returns {void}
       */
      oneditsave: function () {
        console.log("[FC-Monaco] COMP oneditsave");
        const code = compEditorInstance
          ? compEditorInstance.getValue()
          : $("#fcc-fallback").val();
        $("#node-input-compCode").val(code);
        this.compCode = code;
        if (compEditorInstance) {
          compEditorInstance.getModel().dispose();
          compEditorInstance.dispose();
          compEditorInstance = null;
          console.log("[FC-Monaco] COMP: editor + model disposed");
        }
      },

      /**
       * User cancelled the dialog — discard Monaco state without writing
       * back to the node. Same dispose pattern as oneditsave to avoid
       * leaking model graphs.
       * @returns {void}
       */
      oneditcancel: function () {
        console.log("[FC-Monaco] COMP oneditcancel");
        if (compEditorInstance) {
          compEditorInstance.getModel().dispose();
          compEditorInstance.dispose();
          compEditorInstance = null;
          console.log("[FC-Monaco] COMP: editor + model disposed");
        }
      },

      /**
       * Resize handler — Monaco doesn't react to container size changes
       * unless we call `editor.layout()` explicitly. Subtracts ~180 px of
       * chrome (label, buttons, padding) from the dialog height.
       * @param {{height: number, width: number}} size
       * @returns {void}
       */
      oneditresize: function (size) {
        let h = size.height - 180;
        if (h < 150) h = 150;
        $("#fcc-editor-wrap").css("height", h + "px");
        if (compEditorInstance) compEditorInstance.layout();
      },
    });
  })();
</script>

<script type="text/javascript">
  (function () {
    let utilEditorInstance = null;

    // Local copy of the identifier validator — each editor <script> block is
    // wrapped in its own IIFE, so the helper defined in the fc-portal-component
    // block above is out of scope here. Mirrors lib/helpers.js isSafeName.
    const FC_NAME_RE = /^[A-Za-z_$][\w$]*$/;
    const FC_NAME_MAX = 64;
    const FC_NAME_BLACKLIST = [
      "__proto__", "constructor", "prototype", "hasOwnProperty",
      "isPrototypeOf", "propertyIsEnumerable", "toString", "valueOf",
      "toLocaleString",
    ];
    /**
     * Mirror of `lib/helpers.js#isSafeName` — used as `defaults.utilName.validate`
     * so the editor flags invalid identifiers in red before the user can
     * deploy a node that the server would later reject. Rules: non-empty
     * string, ≤ 64 chars, JS identifier syntax, not on the prototype-key
     * blacklist.
     * @param {unknown} v
     * @returns {boolean}
     */
    function fcValidateName(v) {
      return (
        typeof v === "string" &&
        v.length > 0 &&
        v.length <= FC_NAME_MAX &&
        FC_NAME_RE.test(v) &&
        FC_NAME_BLACKLIST.indexOf(v) === -1
      );
    }

    const UTIL_STARTER = [
      "// Helpers / custom hooks / constants — top-level, no React component.",
      "// Each symbol declared here is available globally in any portal that",
      "// references it (selective inclusion: unused utility nodes are skipped).",
      "",
      "const PI2 = Math.PI * 2;",
      "",
      "function clamp(n, min, max) {",
      "  return Math.max(min, Math.min(max, n));",
      "}",
      "",
      "// Custom React hook — call from inside App() or library components",
      "function useDebounce(value, ms = 300) {",
      "  const [v, setV] = React.useState(value);",
      "  React.useEffect(() => {",
      "    const t = setTimeout(() => setV(value), ms);",
      "    return () => clearTimeout(t);",
      "  }, [value, ms]);",
      "  return v;",
      "}",
    ].join("\n");

    RED.nodes.registerType("fc-portal-utility", {
      category: "fromcubes",
      color: "#fbbf24",
      defaults: {
        name: { value: "" },
        utilName: {
          value: "myHelpers",
          required: true,
          validate: fcValidateName,
        },
        utilCode: {
          value: UTIL_STARTER,
          validate: function (v) {
            return typeof v === "string" && v.trim().length > 0;
          },
        },
      },
      inputs: 0,
      outputs: 0,
      icon: "fromcubes-utility.svg",
      paletteLabel: "React Utility",
      inputLabels: [],
      outputLabels: [],
      /**
       * Canvas label — `name → utilName → "utility"`.
       * @returns {string}
       */
      label: function () {
        return this.name || this.utilName || "utility";
      },

      /**
       * Editor lifecycle for `fc-portal-utility`: lazy-load Monaco,
       * create a JS model with URI `file:///fc-util-<nodeId>.js` (note
       * `.js` not `.jsx` — utility code is plain JS).
       * @returns {void}
       */
      oneditprepare: function () {
        const node = this;
        const code =
          typeof node.utilCode === "string" ? node.utilCode : UTIL_STARTER;
        console.log("[FC-Monaco] UTIL oneditprepare, node.id=" + node.id);

        // Hand off to the full-screen React Editor: the dialog saves and
        // closes itself first (its oneditsave owns the same field).
        $("#fcu-btn-react-editor").on("click", function () {
          if (!window.__fcPortalWorkspace) {
            RED.notify("React Editor is not available", "warning");
            return;
          }
          window.__fcPortalWorkspace.openNodeFile(node.id, "utilCode");
        });

        window.__fcRefreshCssClasses();

        window.__fcLoadMonaco(function (failed) {
          if (failed) {
            $("#fcu-monaco").hide();
            $("#fcu-fallback").show().val(code);
            return;
          }
          window.__fcApplyJsxDefaults();

          const utilUri = monaco.Uri.parse("file:///fc-util-" + node.id + ".js");
          const existingModel = monaco.editor.getModel(utilUri);
          if (existingModel) existingModel.dispose();
          const utilModel = monaco.editor.createModel(code, "javascript", utilUri);

          utilEditorInstance = monaco.editor.create(
            document.getElementById("fcu-monaco"),
            Object.assign({ model: utilModel }, window.__fcEditorOpts),
          );
          if (window.__fcAttachKeybindings)
            window.__fcAttachKeybindings(utilEditorInstance);
        });
      },

      /**
       * Editor → flow: write Monaco contents back to `utilCode`, dispose
       * model+editor.
       * @returns {void}
       */
      oneditsave: function () {
        const code = utilEditorInstance
          ? utilEditorInstance.getValue()
          : $("#fcu-fallback").val();
        $("#node-input-utilCode").val(code);
        this.utilCode = code;
        if (utilEditorInstance) {
          utilEditorInstance.getModel().dispose();
          utilEditorInstance.dispose();
          utilEditorInstance = null;
        }
      },

      /**
       * Discard Monaco state without writing back.
       * @returns {void}
       */
      oneditcancel: function () {
        if (utilEditorInstance) {
          utilEditorInstance.getModel().dispose();
          utilEditorInstance.dispose();
          utilEditorInstance = null;
        }
      },

      /**
       * Layout Monaco on dialog resize. -200 px chrome for the utility
       * dialog (taller because of the symbol-list panel).
       * @param {{height: number, width: number}} size
       * @returns {void}
       */
      oneditresize: function (size) {
        let h = size.height - 200;
        if (h < 150) h = 150;
        $("#fcu-editor-wrap").css("height", h + "px");
        if (utilEditorInstance) utilEditorInstance.layout();
      },
    });
  })();
</script>

      "//   data  = last msg.payload from input wire",

      "// Components from fc-portal-component nodes are available by name.",

      "",
      "  return (",
      '    <div className="min-h-screen bg-zinc-950 p-8">',
      '      <h1 className="text-2xl font-light text-cyan-400 mb-6">fromcubes</h1>',
      '      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">',
